<article class="art-card">
  <a class="art-image-wrap" href="{% url 'artwork_detail' work.pk %}">
    {% if work.display_image %}
      <img class="art-image" src="{{ work.display_image }}" alt="{{ work.title }}" loading="lazy">
    {% else %}
      <div class="image-placeholder" role="img" aria-label="Imagem indisponível">ArtGallery</div>
    {% endif %}
    {% if work.promotion %}<span class="sale-badge">Promoção</span>{% endif %}
  </a>
  <div class="art-card-body">
    <div class="art-card-top">
      <div>
        <h3><a href="{% url 'artwork_detail' work.pk %}">{{ work.title }}</a></h3>
        <div class="art-artist">{{ work.artist.name }} · {{ work.style }}</div>
      </div>
      <span class="art-price">R$ {{ work.price|floatformat:2 }}</span>
    </div>
    <div class="art-card-foot">
      <a class="text-link" href="{% url 'artwork_detail' work.pk %}">Detalhes da obra →</a>
      <form method="post" action="{% url 'toggle_like' work.pk %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button class="like-button{% if work.is_liked %} liked{% endif %}" type="submit" aria-label="{% if work.is_liked %}Descurtir{% else %}Curtir{% endif %} {{ work.title }}">
          {% if work.is_liked %}♥{% else %}♡{% endif %}
        </button>
      </form>
    </div>
    <span class="artist-meta">{{ work.width }} × {{ work.height }} cm</span>
  </div>
</article>
